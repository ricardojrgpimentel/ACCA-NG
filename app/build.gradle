plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'com.google.devtools.ksp'
}

def keystoreProperties = new Properties()
def signingPropertiesPath = System.getenv("ACCA_KEYSTORE_PROPERTIES_LOCATION")
def signingPropertiesFile = rootProject.file(signingPropertiesPath ?: "keystore.properties")
if (signingPropertiesPath && !signingPropertiesFile.isFile()) {
    throw new GradleException("ACCA_KEYSTORE_PROPERTIES_LOCATION must point to an existing file.")
}
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValues = ["ACCA_KEYSTORE_LOCATION", "ACCA_KEYSTORE_PASSWORD", "ACCA_KEY_ALIAS", "ACCA_KEY_PASSWORD"]
        .collectEntries { name -> [(name): System.getenv(name) ?: keystoreProperties.getProperty(name)] }
def hasReleaseSigning = signingValues.values().every { it }
if (signingValues.values().any { it } && !hasReleaseSigning) {
    throw new GradleException("Release signing is incomplete. Set all four ACCA signing values; see docs/RELEASING.md.")
}

android {
    // NOTE: namespace intentionally stays mattecarra.accapp so that all
    // existing Kotlin imports (mattecarra.accapp.R, BuildConfig, ...) keep
    // working. The installed app identity is applicationId below.
    namespace "mattecarra.accapp"

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(signingValues["ACCA_KEYSTORE_LOCATION"])
                storePassword signingValues["ACCA_KEYSTORE_PASSWORD"]
                keyAlias signingValues["ACCA_KEY_ALIAS"]
                keyPassword signingValues["ACCA_KEY_PASSWORD"]
            }
        }
    }
    compileSdk 36
    defaultConfig {
        // New app identity for this fork (installs side-by-side with the
        // original mattecarra.accapp). All hardcoded data/data paths and the
        // FileProvider authority follow this id (see Acc.initAppDirs and the
        // manifest placeholder).
        applicationId "com.accang.app"
        minSdk 26
        targetSdk 36
        versionCode 42
        versionName "2.0.0-ng-beta.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
    lint {
        disable += 'MissingTranslation'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "androidx.appcompat:appcompat:${versions.appcompat}"
    implementation "androidx.core:core-ktx:${versions.coreKtx}"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.cardview:cardview:1.0.0"

    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    implementation 'com.afollestad.material-dialogs:datetime:3.3.0'

    implementation "com.google.code.gson:gson:${versions.gson}"

    implementation "com.github.topjohnwu.libsu:core:${versions.libsuVersion}"

    // CircleProgressBar (dinuscxj) is vendored under
    // app/src/main/java/com/dinuscxj/progressbar because the published
    // artifact never reached Maven Central and jcenter is gone.
    // Tooltip library: https://github.com/sephiroth74/android-target-tooltip
    implementation 'com.github.sephiroth74:android-target-tooltip:2.0.4'

    // CircularImageView - https://github.com/hdodenhof/CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'org.apache.commons:commons-collections4:4.4'

    // Room components
    implementation "androidx.room:room-runtime:${versions.roomVersion}"
    implementation "androidx.room:room-ktx:${versions.roomVersion}"
    ksp "androidx.room:room-compiler:${versions.roomVersion}"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${versions.lifecycle}"
    // alternately - if using Java8, use the following instead of lifecycle-compiler
    implementation "androidx.lifecycle:lifecycle-common-java8:${versions.lifecycle}"

    // Coroutines
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:${versions.coroutines}"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:${versions.coroutines}"

    // ViewPager
    // https://developer.android.com/jetpack/androidx/releases/viewpager2
    implementation "androidx.viewpager2:viewpager2:${versions.viewpager}"

    // Google Material Components
    implementation "com.google.android.material:material:${versions.material}"

    // Custom tabs
    implementation "androidx.browser:browser:${versions.browser}"

    // Kotlin JSON Library for exporting and importing
    implementation "com.squareup.moshi:moshi:${versions.moshi}"
    implementation "com.squareup.moshi:moshi-kotlin:${versions.moshi}"
    ksp "com.squareup.moshi:moshi-kotlin-codegen:${versions.moshi}"

    // Fragment KTX module
    implementation "androidx.fragment:fragment-ktx:${versions.fragmentKtx}"
}
